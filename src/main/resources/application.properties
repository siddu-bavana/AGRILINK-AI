spring.application.name=agrilink-ai
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.datasource.url=jdbc:h2:file:./data/agrilink;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:AgriLinkDevelopmentSecretKeyMustBeAtLeastThirtyTwoCharactersLong123}
app.jwt.expiration-hours=168
